<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Textos por Turma</title><style>
:root{--wine:#79283b;--dark:#5d1c2c;--pink:#f7e9ed;--line:#e7cfd6;--text:#30272a;--muted:#75666b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fbf3f5,#fff);font-family:Arial,sans-serif;color:var(--text)}header{text-align:center;background:#fff;padding:27px 15px;border-bottom:1px solid var(--line);position:relative}header:before,header:after{content:'❦';position:absolute;top:20px;color:#c28b99;font-size:27px}header:before{left:calc(50% - 180px)}header:after{right:calc(50% - 180px)}h1{font: bold clamp(26px,4vw,36px) Georgia,serif;color:var(--wine);margin:0}header p{color:var(--muted);font-size:14px;margin:8px 0 0}main{width:min(1000px,calc(100% - 28px));margin:28px auto}.panel{position:relative;background:#fff;border:1px solid var(--line);border-radius:17px;padding:clamp(18px,3vw,30px);box-shadow:0 12px 32px #57202d16}.panel:before,.modal:before{content:'';position:absolute;inset:7px;border:1px solid #f0e1e5;border-radius:11px;pointer-events:none}.panel>*{position:relative}.bar{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}label{display:block;font-size:13px;font-weight:bold;color:var(--dark);margin:0 0 7px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d8bdc6;border-radius:9px;background:white;font:inherit;color:var(--text)}input:focus,select:focus,textarea:focus{outline:2px solid #79283b22;border-color:var(--wine)}button{background:var(--wine);color:white;border:0;border-radius:9px;padding:11px 16px;font-weight:bold;cursor:pointer}button:hover{background:var(--dark)}button.secondary{background:var(--pink);color:var(--dark);border:1px solid var(--line)}button:disabled{opacity:.45;cursor:not-allowed}.hint{font-size:13px;color:var(--muted);margin:9px 0 0}.section{margin-top:25px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}h2{font: bold 21px Georgia,serif;color:var(--wine);margin:0}.list{display:flex;flex-direction:column;gap:9px}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 15px;border:1px solid var(--line);border-radius:12px;background:#fff}.item strong{display:block}.item small{display:block;color:var(--muted);margin-top:5px}.badge{display:inline-block;background:var(--pink);color:var(--dark);padding:4px 8px;border-radius:30px;font-size:12px;font-weight:bold}.empty{padding:23px;text-align:center;border:1px dashed #d9b8c2;border-radius:12px;color:var(--muted);background:#fffafb}.actions{position:relative}.actions>button{min-width:105px}.menu{display:none;position:absolute;right:0;top:100%;z-index:20;min-width:175px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 12px 30px #32101c22}.actions:hover .menu,.actions:focus-within .menu{display:block}.menu button{display:block;width:100%;text-align:left;background:#fff;color:var(--text);padding:10px;transform:none}.menu button:hover{background:var(--pink);color:var(--wine)}.backdrop{display:none;position:fixed;inset:0;background:#25101880;z-index:100;align-items:center;justify-content:center;padding:16px}.backdrop.open{display:flex}.modal{position:relative;width:min(620px,100%);max-height:90vh;overflow:auto;background:#fffdfd;border:1px solid var(--line);border-radius:17px;padding:25px;box-shadow:0 25px 70px #0004}.modal>*{position:relative}.modal h2{margin-bottom:18px;padding-right:35px}.close{position:absolute;right:13px;top:10px;background:transparent;color:var(--wine);font-size:26px;padding:3px 9px;z-index:2}.close:hover{background:var(--pink)}.field{margin-bottom:14px}.field textarea{min-height:240px;resize:vertical;line-height:1.55}.foot{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;margin-top:18px}.footnote{text-align:center;color:#927a81;font-size:12px;margin-top:17px}@media(max-width:600px){.bar{grid-template-columns:1fr}.item{grid-template-columns:1fr}.actions{justify-self:start}header:before{left:12px}header:after{right:12px}}
</style></head><body><header><h1>Textos por Turma</h1><p>Cadastre turmas e alunos, organize os textos e prepare as folhas individuais.</p></header><main><section class="panel"><div class="bar"><div><label for="acao">Ação</label><select id="acao"><option value="">Selecione uma ação...</option><option value="turmas">Cadastrar / consultar turmas</option><option value="alunos">Cadastrar / consultar alunos</option><option value="textos">Lançar textos</option></select></div><button id="buscar">Buscar</button></div><p class="hint">Escolha uma ação e clique em Buscar. Cadastros e edições abrem em pop-ups.</p><div id="resultado" class="section"></div><div class="footnote">Os dados ficam guardados neste navegador. Exporte ou faça uma cópia de segurança regularmente.</div></section></main><div class="backdrop" id="backdrop" role="dialog" aria-modal="true"><div class="modal"><button class="close" id="close" aria-label="Fechar">×</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script>
(()=>{const KEY='textosPorTurma_v2';let db={turmas:[],alunos:[],textos:{}};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const sort=(a,b)=>a.nome.localeCompare(b.nome,'pt-BR',{sensitivity:'base'});function save(){localStorage.setItem(KEY,JSON.stringify(db))}function load(){try{let d=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('textosPorTurma')||'{}');db={turmas:d.turmas||[],alunos:d.alunos||[],textos:d.textos||{}}}catch(e){}}function tname(id){return db.turmas.find(t=>t.id===id)?.nome||'Turma não encontrada'}function tsigla(id){return db.turmas.find(t=>t.id===id)?.folha||tname(id)}function options(sel=''){return '<option value="">Selecione a turma...</option>'+db.turmas.slice().sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR',{numeric:true})).map(t=>`<option value="${esc(t.id)}" ${t.id===sel?'selected':''}>${esc(t.nome)}</option>`).join('')}function modal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('backdrop').classList.add('open')}function close(){ $('backdrop').classList.remove('open') }$('close').onclick=close;$('backdrop').onclick=e=>{if(e.target===$('backdrop'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});function actions(id,kind,extra=''){return `<div class="actions"><button class="secondary">AÇÕES ▾</button><div class="menu"><button data-act="edit-${kind}" data-id="${esc(id)}">Editar ${kind==='aluno'?'aluno':'turma'}</button>${kind==='aluno'?`<button data-act="texto" data-id="${esc(id)}">Informar texto</button>${extra}`:`<button data-act="del-turma" data-id="${esc(id)}">Excluir turma</button>`}</div></div>`}
function showTurmas(){let r=$('resultado'),arr=db.turmas.slice().sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR',{numeric:true}));r.innerHTML=`<div class="sectionhead"><h2>Turmas cadastradas</h2><button id="add">＋ Cadastrar turma</button></div>`+(arr.length?`<div class="list">${arr.map(t=>`<div class="item"><div><strong>${esc(t.nome)}</strong><small>${esc(t.ano)} · Nome na folha: <span class="badge">${esc(t.folha)}</span></small></div>${actions(t.id,'turma')}</div>`).join('')}</div>`:'<div class="empty">Ainda não há turmas cadastradas.</div>');$('add').onclick=()=>turmaForm();r.querySelectorAll('[data-act="edit-turma"]').forEach(b=>b.onclick=()=>turmaForm(b.dataset.id));r.querySelectorAll('[data-act="del-turma"]').forEach(b=>b.onclick=()=>{if(db.alunos.some(a=>a.turmaId===b.dataset.id)){alert('Esta turma possui alunos. Transfira ou exclua os alunos antes de excluir a turma.');return}if(confirm('Excluir esta turma?')){db.turmas=db.turmas.filter(t=>t.id!==b.dataset.id);save();showTurmas()}})}
function turmaForm(id=''){let t=db.turmas.find(x=>x.id===id)||{nome:'',ano:'',folha:''};modal(id?'Editar turma':'Cadastrar turma',`<form id="form"><div class="field"><label>Nome da turma</label><input id="nome" required value="${esc(t.nome)}" placeholder="Ex.: 7º ANO - 702"></div><div class="field"><label>Ano escolar</label><input id="ano" required value="${esc(t.ano)}" placeholder="Ex.: 7º Ano"></div><div class="field"><label>Nome que aparecerá na folha do aluno</label><input id="folha" required value="${esc(t.folha)}" placeholder="Ex.: 702"><p class="hint">Será usado no final: “Autor: Nome do aluno - 702”.</p></div><div class="foot"><button type="button" class="secondary" id="cancel">Cancelar</button><button>Salvar turma</button></div></form>`);$('cancel').onclick=close;$('form').onsubmit=e=>{e.preventDefault();let d={nome:$('nome').value.trim().toLocaleUpperCase('pt-BR'),ano:$('ano').value.trim(),folha:$('folha').value.trim().toLocaleUpperCase('pt-BR')};if(id)Object.assign(db.turmas.find(x=>x.id===id),d);else db.turmas.push({id:uid(),...d});save();close();showTurmas()}}
function showAlunos(filter=''){let r=$('resultado'),arr=db.alunos.filter(a=>!filter||a.turmaId===filter).slice().sort(sort);r.innerHTML=`<div class="sectionhead"><div><h2>Alunos cadastrados</h2><p class="hint">Em ordem alfabética pelo nome completo.</p></div><button id="add" ${db.turmas.length?'':'disabled'}>＋ Cadastrar aluno</button></div>`+(!db.turmas.length?'<div class="empty">Cadastre uma turma antes de cadastrar alunos.</div>':arr.length?`<div class="list">${arr.map(a=>`<div class="item"><div><strong>${esc(a.nome)}</strong><small>${esc(tname(a.turmaId))} · ${esc(a.genero==='F'?'Feminino':a.genero==='M'?'Masculino':'Prefiro não informar')}</small></div>${actions(a.id,'aluno')}</div>`).join('')}</div>`:'<div class="empty">Nenhum aluno encontrado.</div>');$('add').onclick=()=>alunoForm();r.querySelectorAll('[data-act="edit-aluno"]').forEach(b=>b.onclick=()=>alunoForm(b.dataset.id));r.querySelectorAll('[data-act="texto"]').forEach(b=>b.onclick=()=>textoForm(b.dataset.id));r.querySelectorAll('[data-act="del-aluno"]').forEach(b=>b.onclick=()=>delAluno(b.dataset.id))}
function alunoForm(id=''){if(!db.turmas.length){alert('Cadastre uma turma primeiro.');return}let a=db.alunos.find(x=>x.id===id)||{nome:'',turmaId:'',genero:''};modal(id?'Editar aluno':'Cadastrar aluno',`<form id="form"><div class="field"><label>Nome completo do(a) aluno(a)</label><input id="nome" required value="${esc(a.nome)}" placeholder="Nome completo"></div><div class="field"><label>Turma</label><select id="turma" required>${options(a.turmaId)}</select></div><div class="field"><label>Género</label><select id="genero" required><option value="">Selecione...</option><option value="F" ${a.genero==='F'?'selected':''}>Feminino</option><option value="M" ${a.genero==='M'?'selected':''}>Masculino</option><option value="N" ${a.genero==='N'?'selected':''}>Prefiro não informar</option></select></div><div class="foot"><button type="button" class="secondary" id="cancel">Cancelar</button><button>Salvar aluno</button></div></form>`);$('cancel').onclick=close;$('form').onsubmit=e=>{e.preventDefault();let d={nome:$('nome').value.trim().replace(/\s+/g,' '),turmaId:$('turma').value,genero:$('genero').value};if(id)Object.assign(db.alunos.find(x=>x.id===id),d);else db.alunos.push({id:uid(),...d});save();close();showAlunos()}}
function delAluno(id){let a=db.alunos.find(x=>x.id===id);if(a&&confirm('Excluir o cadastro de '+a.nome+'?')){db.alunos=db.alunos.filter(x=>x.id!==id);save();showAlunos()}}
function textoForm(id=''){if(!db.alunos.length){alert('Cadastre pelo menos um aluno primeiro.');return}let a=db.alunos.find(x=>x.id===id),old=a?(db.textos[a.id]||{}):{};modal('Informar texto',`<form id="form">${a?`<p><span class="badge">${esc(a.nome)}</span> <span class="badge">${esc(tsigla(a.turmaId))}</span></p>`:`<div class="field"><label>Aluno</label><select id="aluno" required><option value="">Selecione o aluno...</option>${db.alunos.slice().sort(sort).map(x=>`<option value="${esc(x.id)}">${esc(x.nome)} — ${esc(tsigla(x.turmaId))}</option>`).join('')}</select></div>`}<div class="field"><label>Título do texto</label><input id="titulo" required value="${esc(old.titulo||'')}" placeholder="Título do texto"></div><div class="field"><label>Texto</label><textarea id="conteudo" required placeholder="Digite ou cole o texto do aluno...">${esc(old.conteudo||'')}</textarea></div><div class="foot"><button type="button" class="secondary" id="cancel">Cancelar</button><button>Salvar texto</button></div></form>`);$('cancel').onclick=close;$('form').onsubmit=e=>{e.preventDefault();let aid=a?a.id:$('aluno').value;if(!aid)return;db.textos[aid]={titulo:$('titulo').value.trim(),conteudo:$('conteudo').value.trim()};save();close();if($('acao').value==='textos')showTextos();else showAlunos()}}
function showTextos(){let r=$('resultado');r.innerHTML=`<div class="sectionhead"><h2>Lançar textos</h2></div><div class="bar"><div><label for="filtro">Turma:</label><select id="filtro">${options()}</select></div><button id="buscarTurma" ${db.turmas.length?'':'disabled'}>Buscar</button></div><p class="hint">Selecione uma turma e clique em Buscar para ver os alunos em ordem alfabética.</p><div id="daTurma" class="section"></div>`;$('buscarTurma').onclick=()=>{let id=$('filtro').value;if(!id){$('daTurma').innerHTML='<div class="empty">Selecione uma turma antes de buscar.</div>';return}renderStudents(id)};if(!db.turmas.length)$('daTurma').innerHTML='<div class="empty">Cadastre uma turma para começar.</div>'}
function renderStudents(tid){let target=$('daTurma'),arr=db.alunos.filter(a=>a.turmaId===tid).slice().sort(sort);target.innerHTML=arr.length?`<div class="list">${arr.map(a=>{let t=db.textos[a.id];return `<div class="item"><div><strong>${esc(a.nome)}</strong><small>${t?`Texto: ${esc(t.titulo)} · <span class="badge">Salvo</span>`:'Nenhum texto informado'}</small></div><div class="actions"><button>AÇÕES ▾</button><div class="menu"><button data-act="edit-aluno" data-id="${esc(a.id)}">Editar aluno</button><button data-act="texto" data-id="${esc(a.id)}">Informar texto</button><button data-act="preview" data-id="${esc(a.id)}">Pré-visualizar texto</button></div></div></div>`}).join('')}</div>`:'<div class="empty">Não há alunos cadastrados nesta turma.</div>';target.querySelectorAll('[data-act="edit-aluno"]').forEach(b=>b.onclick=()=>alunoForm(b.dataset.id));target.querySelectorAll('[data-act="texto"]').forEach(b=>b.onclick=()=>textoForm(b.dataset.id));target.querySelectorAll('[data-act="preview"]').forEach(b=>b.onclick=()=>preview(b.dataset.id))}
function preview(id){let a=db.alunos.find(x=>x.id===id),t=db.textos[id];if(!a||!t){alert('Este aluno ainda não tem texto salvo.');return}let author=a.genero==='F'?'Autora':'Autor';modal('Pré-visualização do texto',`<article style="font-family:Georgia,serif;line-height:1.6;padding:6px"><h2 style="text-align:center;margin-bottom:25px">${esc(t.titulo)}</h2><div style="white-space:pre-wrap">${esc(t.conteudo)}</div><p style="text-align:right;margin-top:28px">${author}: ${esc(a.nome)} - ${esc(tsigla(a.turmaId))}</p></article><div class="foot"><button class="secondary" id="cancel">Fechar</button><button id="print">Imprimir / guardar em PDF</button></div>`);$('cancel').onclick=close;$('print').onclick=()=>{let w=window.open('','_blank');if(!w){alert('Permita pop-ups para abrir a impressão.');return}w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(t.titulo)}</title><style>@page{size:A4;margin:2.3cm}body{font-family:Georgia,serif;font-size:12pt;line-height:1.55;color:#222}h1{text-align:center;font-size:18pt;margin:0 0 28px}.content{white-space:pre-wrap}.author{text-align:right;margin-top:30px;font-size:11pt}</style></head><body><h1>${esc(t.titulo)}</h1><div class="content">${esc(t.conteudo)}</div><p class="author">${author}: ${esc(a.nome)} - ${esc(tsigla(a.turmaId))}</p><script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close()}}
$('buscar').onclick=()=>{let a=$('acao').value;if(a==='turmas')showTurmas();else if(a==='alunos')showAlunos();else if(a==='textos')showTextos();else $('resultado').innerHTML='<div class="empty">Selecione uma ação na lista suspensa.</div>'};load();
})();
</script></body></html>
